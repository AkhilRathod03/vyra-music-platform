name: Deploy VYRA Theme to InfinityFree

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/vyra-theme/**'
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy Theme via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Theme to Live Server
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: wp-content/themes/vyra-theme/
          server-dir: /htdocs/wp-content/themes/vyra-theme/
